name: RPM checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  spec-check:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install RPM tooling
        run: |
          dnf install -y make rpm-build rpmlint pyproject-rpm-macros systemd-rpm-macros
      - name: Check specs
        run: make check
